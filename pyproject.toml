[project]
name = "credit-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "lib>=4.0.0",
    "matplot>=0.1.9",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
credit-risk = "credit_risk:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
